name: Deploy

on:
  push:
    branches: [main, claude/serene-carson-k64lwr]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: api
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
        working-directory: api
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: api
      - name: Deploy API (api.albarza.ai)
        working-directory: api
        run: npx wrangler deploy
      - name: Set API secrets
        working-directory: api
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          INTERNAL_AUTH_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$INTERNAL_AUTH_SECRET"
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          printf '%s' "$INTERNAL_AUTH_SECRET" | npx wrangler secret put INTERNAL_AUTH_SECRET
          echo "INTERNAL_AUTH_SECRET=$INTERNAL_AUTH_SECRET" >> "$GITHUB_ENV"
      - name: Build and deploy frontend (albarza.ai)
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy
          printf '%s' "$INTERNAL_AUTH_SECRET" | npx wrangler secret put INTERNAL_AUTH_SECRET
