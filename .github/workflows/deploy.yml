name: Deploy

on:
  push:
    branches: [main, claude/serene-carson-k64lwr]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: api
      # Frontend: glob CLI advisory comes from the OpenNext build chain (build-time only, not shipped); gate on critical.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --omit=dev --audit-level=high
        working-directory: api
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: api
      - name: Prepare accounts database (D1)
        run: bash scripts/ci-d1.sh
      - name: Deploy API (api.albarza.ai)
        working-directory: api
        run: npx wrangler deploy
      - name: Set API secrets
        working-directory: api
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          INTERNAL_AUTH_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$INTERNAL_AUTH_SECRET"
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          printf '%s' "$INTERNAL_AUTH_SECRET" | npx wrangler secret put INTERNAL_AUTH_SECRET
          # Stable pepper (derived, never stored) so pseudonymised audit entries stay consistent across deploys.
          HASH_PEPPER=$(printf 'albarza-pepper:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$HASH_PEPPER"
          printf '%s' "$HASH_PEPPER" | npx wrangler secret put HASH_PEPPER
          for K in RESEND_API_KEY EMAIL_FROM TURNSTILE_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do V="${!K:-}"; [ -n "$V" ] && printf '%s' "$V" | npx wrangler secret put "$K"; done
          echo "INTERNAL_AUTH_SECRET=$INTERNAL_AUTH_SECRET" >> "$GITHUB_ENV"
      - name: Build and deploy frontend (albarza.ai)
        env:
          NEXT_PUBLIC_GOOGLE_ENABLED: ${{ secrets.GOOGLE_CLIENT_ID != '' && '1' || '0' }}
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy
          printf '%s' "$INTERNAL_AUTH_SECRET" | npx wrangler secret put INTERNAL_AUTH_SECRET
      - name: Smoke test accounts (sign up, read, delete a throwaway user)
        continue-on-error: true
        run: bash scripts/smoke-accounts.sh
      - name: Harden zone (TLS, HSTS, bots, WAF, rate limits)
        run: python3 scripts/harden-zone.py
