name: check-users
on:
  push:
    branches: [claude/serene-carson-k64lwr]
    paths: [.github/workflows/check-users.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve D1 id
        run: bash scripts/ci-d1.sh
      - name: Masked read of recent accounts
        working-directory: api
        run: |
          npx wrangler d1 execute albarza-db --remote --command "SELECT substr(u.email,1,2)||'***'||substr(u.email,instr(u.email,'@')) AS email, u.email_verified AS verified, (SELECT group_concat(provider) FROM oauth_accounts o WHERE o.user_id=u.id) AS providers, (u.password_hash IS NOT NULL) AS has_password, (SELECT count(*) FROM sessions s WHERE s.user_id=u.id) AS sessions, u.created_at FROM users u ORDER BY u.created_at DESC LIMIT 12"
