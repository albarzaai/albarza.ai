name: Generate hero video

on:
  workflow_dispatch:
  push:
    branches: [claude/serene-carson-k64lwr]
    paths: [".github/workflows/hero-video.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate with Veo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/generate-hero-video.py
      - name: Commit video
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/media/hero-abudhabi.mp4 public/media/hero-abudhabi.jpg
          git commit -m "Add Abu Dhabi hero video (Veo)"
          git push

# retry 3
